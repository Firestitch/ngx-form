@if (showSave || create) {
  <button
      mat-button
      type="submit"
      color="primary"
      [name]="name">
    {{ create ? 'Create' : 'Save' }}
  </button>
  <button
      mat-button
      type="button"
      class="cancel-button"
      [disabled]="close && !dirty && !create"
      [mat-dialog-close]="null">
    Cancel
  </button>
}
@if (showDone) {
  <button
      mat-button
      type="button"
      color="primary"
      [mat-dialog-close]="null">
    Done
  </button>
}
@if (showSave || create) {
  <ng-template [ngTemplateOutlet]="content"></ng-template>
}
@if (close) {
  <button
      mat-button
      type="button"
      class="close-button"
      fsFormDialogClose
      [closeData]="closeData"
      [color]="dirty ? 'basic' : 'primary'">
    Close
  </button>
}
@if (!(showSave || create)) {
  <ng-template [ngTemplateOutlet]="content"></ng-template>
}
<ng-template #content>
  <ng-content></ng-content>
</ng-template>
